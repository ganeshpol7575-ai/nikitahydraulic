.hc-row .v.mono{font-family:var(--f-mono);font-size:12px}
.hc-cta{margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.07)}
.hc-cta .btn{width:100%}
.scroll-cue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;color:rgba(255,255,255,.35);font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;z-index:2}
.scroll-cue .bar{width:1px;height:28px;background:linear-gradient(to bottom,rgba(255,255,255,.3),transparent);position:relative;overflow:hidden}
.scroll-cue .bar::after{content:"";position:absolute;top:0;left:0;width:100%;height:40%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:scrollBar 2.2s infinite var(--ease)}
@keyframes scrollBar{0%{top:-40%}100%{top:100%}}

.marquee{padding:22px 0;background:var(--navy);border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);overflow:hidden;position:relative}
.marquee::before,.marquee::after{content:"";position:absolute;top:0;bottom:0;width:80px;z-index:2;pointer-events:none}
.marquee::before{left:0;background:linear-gradient(to right,var(--navy),transparent)}
.marquee::after{right:0;background:linear-gradient(to left,var(--navy),transparent)}
.marquee-track{display:flex;gap:clamp(28px,6vw,64px);width:max-content;animation:scroll 34s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes scroll{to{transform:translateX(-50%)}}
.marquee-item{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.55);font-family:var(--f-display);font-size:clamp(13px,3vw,15px);font-weight:500;white-space:nowrap;transition:color .3s}
.marquee-item:hover{color:#fff}
.marquee-item::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent),0 0 24px var(--accent);flex-shrink:0}

.sec.alt{background:var(--paper-2)}
